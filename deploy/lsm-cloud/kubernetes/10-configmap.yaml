apiVersion: v1
kind: ConfigMap
metadata:
  name: helion-lsm-env
  namespace: helion
data:
  HELIX_STORAGE_BACKEND: "lsm"
  HELIX_LSM_BUCKET: "replace-with-your-bucket"
  HELIX_LSM_PREFIX: "helion"
  HELIX_LSM_REGION: "us-east-1"
  AWS_REGION: "us-east-1"
  AWS_DEFAULT_REGION: "us-east-1"
  HELIX_LSM_CACHE_DIR: "/cache"
  HELIX_LSM_CACHE_MAX_BYTES: "1073741824"
  HELIX_LSM_CACHE_MEMORY_MAX_PCT: "25"
  HELIX_LSM_CACHE_SCAN_SECS: "0"
  HELIX_LSM_CACHE_MAX_OPEN_FILES: "32"
  HELIX_LSM_COLLECTION_CACHE_UNBOUNDED: "0"
  HELIX_MAX_OPEN_COLLECTIONS: "32"
  HELIX_PORT: "6969"
  HELIX_DATA_DIR: "/data"
  HELIX_GRAPH: "1"
  HELIX_LOG: "info"
  HELIX_LSM_INIT_WAIT_SECS: "300"
  HELIX_LSM_MAX_UNFLUSHED_BYTES: "134217728"
  HELIX_LSM_FLUSH_INTERVAL_MS: "500"
  HELIX_LSM_L0_SST_SIZE_BYTES: "67108864"
  HELIX_LSM_COMPRESSION_CODEC: "lz4"
  HELIX_LSM_MANIFEST_POLL_MS: "30000"
  HELIX_LSM_READER_MANIFEST_POLL_MS: "5000"
  HELIX_LSM_COMPACTOR_POLL_MS: "30000"
  HELIX_LSM_COMMIT_COMPACTED_MS: "30000"
  HELIX_LSM_COMPACTOR_WORKER_POLL_MS: "30000"
  HELIX_READ_BLOCKING_CAP: "16"
  HELIX_SEARCH_BLOCKING_CAP: "16"
  HELIX_SCAN_BLOCKING_CAP: "8"
