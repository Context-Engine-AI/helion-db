[package]
name = "helix-cli"
version = "1.0.66"
edition = "2021"
description = "Command-line interface for Helion projects and local deployments."
license = "GPL-3.0-only"
authors = ["Context Engine AI"]
repository = "https://github.com/Context-Engine-AI/helion-db"

[dependencies]
clap = { version = "4.5.36", features = ["derive"] }
helixdb = { path = "../helixdb", features = ["full"] }
tempfile = "3.19.1"
dirs = "6.0.0"
serde = { version = "1.0.219", features = ["derive"] }
sonic-rs = "0.5.0"
uuid = { version = "1.16.0", features = ["v4"] }
chrono = "0.4"
libc = "0.2.171"
tokio = { version = "1.41.1", features = ["full"] }
open = "5.0.1"
colored = "2.1.0"
spinners = "4"
indicatif = "0.17.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.1", features = ["Win32_System_Threading", "Win32_Foundation"] }

[[bin]]
name = "helix"
path = "src/main.rs"
