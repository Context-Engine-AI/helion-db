[package]
name = "helixdb"
version = "0.1.0"
edition = "2021"
description = "Helion graph-vector database engine."
license = "GPL-3.0-only"
authors = ["Context Engine AI", "HelixDB Team"]
repository = "https://github.com/Context-Engine-AI/helion-db"

[dependencies]
crc32c = "0.6"
tokio = { version = "1.44.2", features = ["full"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.110"
raft = { version = "0.7", default-features = false, features = ["prost-codec", "default-logger"] }
prost = "0.11"
slog = "2"
slog-stdlog = "4"
anyhow = "1"
bincode = "1.3.3"                                                         # TODO: Figure out bincode 2 impl with current serde impl
sonic-rs = "0.5.0"
inventory = "0.3.16"
twox-hash = "2.1.0"
heed3 = "0.22.0"
memmap2 = "0.9"
libc = "0.2"
uuid = { version = "1.12.1", features = ["std", "v4", "v6", "fast-rng"] }
rand = "0.9.0"
dirs = "6.0.0"
chrono = "0.4.39"
flume = "0.11.1"
rayon = "1.8.0"
itertools = "0.14.0"
colored = "2.1.0"
lru = "0.12"

# Arena allocation for HNSW hot paths (search/insert priority queues, neighbor
# scratch lists). Eliminates per-node malloc/free during graph descent — sized
# for one request, freed in one shot when the arena drops. Required by
# vector_core::arena_heap and vector_core::heap_utils.
bumpalo = { version = "3.19", features = ["collections", "boxed"] }
# Zero-copy POD reinterpretation for property/edge byte buffers.
bytemuck = "1.24"

# Compiler
pest = { version = "2.7", optional = true }
pest_derive = { version = "2.7", optional = true }

# Ingestion
rust_decimal = { version = "1.34", features = ["tokio-pg"], optional = true }
native-tls = { version = "0.2.11", optional = true }
postgres-native-tls = { version = "0.5", optional = true }
pgvector = { version = "0.4.0", features = ["postgres"], optional = true }
reqwest = { version = "0.12.15", features = [
    "json",
    "blocking",
], optional = true }
rusqlite = { version = "0.35.0", features = ["bundled"], optional = true }
tokio-postgres = { version = "0.7", features = [
    "with-uuid-1",
    "with-chrono-0_4",
], optional = true }

# testing
polars = { version = "0.46.0", optional = true, features = ["parquet", "lazy"] }
tempfile = { version = "3.2", optional = true }
page_size = "0.6.0"
rmp-serde = "1.3.1"
tracing = "0.1.44"
metrics = { version = "0.23", default-features = false }
metrics-exporter-prometheus = { version = "0.15", default-features = false }
governor = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
base64 = "0.22"
parking_lot = "0.12"
rustc-hash = "2.0"
slatedb = { version = "0.14.1", features = ["lz4", "snappy", "zstd"] }
object_store = { version = "0.14", features = ["aws"] }
futures = "0.3"

[dev-dependencies]
criterion = "0.5"
rand = "0.9.0"
csv = "1.1"
lazy_static = "1.4.0"
tempfile = "3.2"
# Concurrency model checking for HNSW under contention (loom-gated tests).
loom = "0.7"
# Property tests for arena heap invariants and HNSW search ordering.
proptest = "1.4"
# Serialize LMDB-backed stress tests so they don't trample each other.
serial_test = "3.2"
# Async test utilities (used by ported integration_stress_tests).
tokio-test = "0.4"

[features]
compiler = ["pest", "pest_derive"]
testing = ["polars", "tempfile"]
loom = []
cosine = []
ingestion = [
    "rusqlite",
    "tokio-postgres",
    "pgvector",
    "postgres-native-tls",
    "reqwest",
    "native-tls",
    "rust_decimal",
    "tempfile"
]
build = ["compiler"]
full = ["build", "compiler", "ingestion", "cosine"]
default = ["full"]

[[bench]]
name = "graph_benchmarks"
harness = false

[[bench]]
name = "vector_benchmarks"
harness = false
