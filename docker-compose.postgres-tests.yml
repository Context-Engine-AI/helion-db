services:
  postgres-test:
    build:
      context: .
      dockerfile: docker/test-postgres/Dockerfile
    container_name: helix-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgtest-data:/var/lib/postgresql/data

volumes:
  pgtest-data:
